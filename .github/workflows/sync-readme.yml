name: 📝 Sincronizar README com paranoid_dead.md

on:
  push:
    branches:
      - main
    paths:
      - 'ObsidianNotesAdriano/projects/paranoid_dead.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: 📋 Copiar paranoid_dead.md para README.md
        run: cp ObsidianNotesAdriano/projects/paranoid_dead.md README.md

      - name: ⚙️ Configurar Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: ✅ Fazer commit se houve mudanças
        run: |
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "🔄 Sincronizar README.md com paranoid_dead.md"
            git push
          else
            echo "Nenhuma mudança no README.md"
          fi
